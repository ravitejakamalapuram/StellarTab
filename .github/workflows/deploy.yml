name: Deploy Chrome Extension

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'newtab/**'
      - 'background.js'
      - 'icons/**'

jobs:
  build-and-deploy:
    name: Package and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Extension (Zip)
        run: |
          echo "Packaging extension..."
          zip -r extension.zip . -x "*.git*" "*node_modules*" "*.github*" "*.DS_Store*" "CHROMEWEBSTORE.md" "*.zip" "generate-icons.js" "*.png"
          echo "Extension packaged successfully."

      - name: Upload and Publish to Chrome Web Store
        uses: trmcnvn/chrome-webstore-upload@v2.2.0
        with:
          file-name: 'extension.zip'
          app-id: ${{ secrets.APP_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
